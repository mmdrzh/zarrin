# Zarrin panel. A compose project of its own, next to (never inside)
# /opt/pasarguard, so PasarGuard updates do not touch it.
services:
  zarrin:
    build:
      context: .
      dockerfile: panel/Dockerfile
    image: zarrin-panel:local
    container_name: zarrin
    restart: unless-stopped
    # Host network: PostgreSQL is published on 127.0.0.1 only, port 80 is
    # needed for Let's Encrypt, and nodes' real addresses pin their tokens.
    network_mode: host
    env_file: .env
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./data:/data
      - ./:/repo:ro
      - ${PASARGUARD_HOST_DIR:-/opt/pasarguard}:/pasarguard:ro
      - ${PASARGUARD_HOST_DATA:-/var/lib/pasarguard}:/pasarguard-data:ro
    logging:
      options: {max-size: "20m", max-file: "3"}
