charon {
    # IKE_AUTH carries the certificate chain; some mobile networks drop
    # fragments near the 1280-byte default, so keep them smaller.
    fragment_size = 1000
    # Many phones share one CGNAT address on Iranian carriers and retry fast;
    # the default of 5 half-open SAs per IP locked them all out.
    block_threshold = 20
    cookie_threshold = 100
    # IKE negotiation to the container log, to see why a phone drops.
    filelog {
        stderr {
            default = 0
            ike = 1
            cfg = 1
            enc = 0
            time_format = %b %e %T
        }
    }
}
